name: SBOM

# A CycloneDX software bill of materials, generated on every tag and attached to
# the release.
#
# This is a Cyber Resilience Act obligation and it costs nothing to do now. It
# also happens to be short: the component declares no Python requirements of its
# own, because every dependency shipped into a customer's house is both attack
# surface and a line somebody has to keep watching.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the SBOM to, for example v1.0.0"
        required: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate CycloneDX SBOM
        run: |
          # Pinned: the CLI renamed its options in 7.x (--outfile became
          # --output-file) and an unpinned tool broke the 1.0.0 release run.
          python -m pip install --upgrade pip "cyclonedx-bom==7.5.0"
          cyclonedx-py environment --output-format JSON --output-file haim-agent-sbom.json

      - name: Attach the SBOM to the release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, that tag; run by hand, the tag it was given.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: haim-agent-sbom.json
