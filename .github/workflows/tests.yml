name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pytest-homeassistant-custom-component pins exactly one Home Assistant
        # per version: choosing it IS choosing the Home Assistant. The last two
        # releases, the same pair the private monorepo tests against.
        include:
          - ha: "2026.10.1"
            phcc: "0.13.372"
          - ha: "2026.9.4"
            phcc: "0.13.367"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.9 and later require Python >= 3.14.2.
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pytest-homeassistant-custom-component==${{ matrix.phcc }}"

      - name: Run the tests
        # The checks against the API contract live in the private monorepo,
        # beside the contract itself and a payload taken from a real house;
        # here they are skipped.
        run: python -m pytest -q
